{% extends 'layout.html' %}

{% block title %}
    Login
{% endblock %}

{% block style %}
<style>
    body {
      background-color:  #486a93;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
      background: #1a2a44;
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      width: 120%;
      max-width: 400px;
      color: #fff;
    }
    .login-card h2 {
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #ff9f43;
    }
    .login-card p {
      color: #cfd8dc;
      margin-bottom: 2rem;
    }
    .form-control:focus {
      box-shadow: 0 0 0 0.25rem rgba(255, 159, 67, 0.5);
      border-color: #ff9f43;
    }
    .btn-login {
      background-color: #ff9f43 ;
      border: none;
      transition: background-color 0.3s ease;
    }
    .btn-login:hover {
      background-color: #f08c14;
    }
    .input-group-text {
      background-color: #ff9f43;
      border: none;
      color: #212529;
    }
    @media (max-width: 400px) {
      body {
        padding: 1rem;
      }
      .login-card {
        padding: 1.5rem;
        border-radius: 0.75rem;
      }
    }
</style>
{% endblock %}

{% block content %}
<main class="login-card">
    <div class="d-flex justify-content-center">
        <h2><i class="bi bi-car-front-fill"></i> PARKIFY</h2>
    </div>
    <div class="d-flex justify-content-center">
        <p>Secure Login to Your PARKIFY Account</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
            <label for="loginEmail" class="form-label">Email address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                <input type="email" class="form-control" id="loginEmail" name="email"
                       placeholder="name@example.com" required value="{{ request.form.email or '' }}" />
            </div>
        </div>
        <div class="mb-3">
            <label for="loginPassword" class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="loginPassword" name="password"
                       placeholder="Password" required />
            </div>
        </div>
        <button type="submit" class="btn btn-login w-100 mb-3">Login</button>
        <div class="text-center">
            <a href="{{ url_for('signup') }}" class="text-decoration-none text-warning">
                Create New Account
            </a>
        </div>
    </form>
</main>
{% endblock %}
