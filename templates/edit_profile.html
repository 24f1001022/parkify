{% extends 'layout.html' %}

{% block title %}
    Edit Profile
{% endblock %}

{% block style %}
<style>
    .main {
        background-color: #486a93;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #fff;
    }

    .edit-card {
        background: #1a2a44;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 500px;
    }

    .edit-card h2 {
        font-weight: 700;
        color: #ff9f43;
        text-align: center;
        margin-bottom: 1.5rem;
    }

    .form-label {
        color: #cfd8dc;
    }

    .form-control:focus {
        box-shadow: 0 0 0 0.25rem rgba(255, 159, 67, 0.5);
        border-color: #ff9f43;
    }

    .btn-save {
        background-color: #ff9f43;
        border: none;
        width: 100%;
        margin-top: 1rem;
    }

    .btn-save:hover {
        background-color: #f08c14;
    }

    @media (max-width: 460px) {
        body {
            padding: 1rem;
        }

        .edit-card {
            padding: 1.5rem;
            border-radius: 0.75rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="main">
<main class="edit-card">
    <h2><i class="bi bi-pencil-square"></i> Edit Profile</h2>
    <form method="POST" action="{{ url_for('save_profile_changes') }}">
        <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="fullName" name="full_name" value="{{ g.user.full_name }}" required />
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ g.user.email }}" required />
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control" id="address" name="address" value="{{ g.user.address }}" />
        </div>
        <div class="mb-3">
            <label for="pincode" class="form-label">Pincode</label>
            <input type="text" class="form-control" id="pincode" name="pin_code"
                 value="{{ g.user.pin_code }}" />
        </div>
        <button type="submit" class="btn btn-save">Save Changes</button>
    </form>
</main>
</div>
{% endblock %}
