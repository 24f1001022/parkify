{% extends 'layout.html' %}

{% block title %}
    Signup
{% endblock %}

{% block style %}
<style>
    body {
        background-color: #486a93;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #fff;
    }

    .signup-card {
        background: #1a2a44;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 450px;
    }

    .signup-card h2 {
        font-weight: 700;
        margin-bottom: 0.5rem;
        color: #ff9f43;
    }

    .signup-card p {
        color: #cfd8dc;
        margin-bottom: 2rem;
    }

    .form-control:focus {
        box-shadow: 0 0 0 0.25rem rgba(255, 159, 67, 0.5);
        border-color: #ff9f43;
    }

    .btn-signup {
        background-color: #ff9f43;
        border: none;
        transition: background-color 0.3s ease;
    }

    .btn-signup:hover {
        background-color: #f08c14;
    }

    .input-group-text {
        background-color: #ff9f43;
        border: none;
        color: #212529;
    }

    @media (max-width: 460px) {
        body {
            padding: 1rem;
        }

        .signup-card {
            padding: 1.5rem;
            border-radius: 0.75rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<main class="signup-card">
    <div class="d-flex justify-content-center"><h2><i class="bi bi-car-front-fill"></i> PARKIFY</h2></div>
    <div class="d-flex justify-content-center"><p>Create a new account for easy vehicle parking</p></div>
    <form method="POST" action="{{ url_for('signup') }}">
        <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" class="form-control" id="fullName" name="full_name"
                       placeholder="Your Full Name" />
            </div>
        </div>
        <div class="mb-3">
            <label for="signupEmail" class="form-label">Email address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                <input type="email" class="form-control" id="signupEmail" name="email"
                       placeholder="name@example.com" required/>
            </div>
        </div>
        <div class="mb-3">
            <label for="signupPassword" class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="signupPassword" name="password"
                       placeholder="Password" required />
            </div>
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-geo-alt-fill"></i></span>
                <input type="text" class="form-control" id="address" name="address"
                       placeholder="Your Address"/>
            </div>
        </div>
        <div class="mb-3">
            <label for="pincode" class="form-label">Pincode</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
                <input type="text" class="form-control" id="pincode" name="pin_code"
                       placeholder="Postal / Zip Code"  pattern=".{6}"
                       title="pincode must have 6 charaters" />
            </div>
        </div>
        <button type="submit" class="btn btn-signup w-100">Sign Up</button>
    </form>
    <div class="text-center mt-3">
        <span>Already have an account?</span>
        <a href="{{ url_for('login') }}" class="text-decoration-none text-warning">
            Login
        </a>
    </div>
    
</main>
{% endblock %}
